{% extends "base.html" %}
{% load static %}

{% block title %}Review Paper{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/review_form.css' %}">
{% endblock %}

{% block content %}

<section class="page-header">

<div class="container">

<h1>Paper Review</h1>

<p>Review the assigned paper and submit your evaluation.</p>

</div>

</section>

<section class="review-section">

<div class="container">

<div class="review-card">

<h3 class="mb-4">Paper Information</h3>

<div class="row">

<div class="col-md-6 mb-3">
<label>Paper ID</label>
<input type="text" class="form-control" value="PAPER001" readonly>
</div>

<div class="col-md-6 mb-3">
<label>Track</label>
<input type="text" class="form-control" value="Artificial Intelligence" readonly>
</div>

<div class="col-12 mb-4">
<label>Paper Title</label>
<input type="text" class="form-control" value="Artificial Intelligence for Healthcare" readonly>
</div>

</div>

<form method="POST">

{% csrf_token %}

<h4 class="mb-3">Review Scores</h4>

<div class="row">

<div class="col-md-4 mb-3">
<label>Originality</label>
<select class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option selected>5</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Technical Quality</label>
<select class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option selected>5</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Novelty</label>
<select class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option selected>5</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Presentation</label>
<select class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option selected>5</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Relevance</label>
<select class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option selected>5</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Overall Rating</label>
<select class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option selected>5</option>
</select>
</div>

</div>

<div class="mb-4">

<label>Strengths</label>

<textarea class="form-control" rows="4"></textarea>

</div>

<div class="mb-4">

<label>Weaknesses</label>

<textarea class="form-control" rows="4"></textarea>

</div>

<div class="mb-4">

<label>Comments to Authors</label>

<textarea class="form-control" rows="5"></textarea>

</div>

<div class="mb-4">

<label>Confidential Comments to Chair</label>

<textarea class="form-control" rows="5"></textarea>

</div>

<div class="mb-4">

<label>Final Recommendation</label>

<select class="form-select">

<option>Accept</option>

<option>Minor Revision</option>

<option>Major Revision</option>

<option>Reject</option>

</select>

</div>

<div class="text-end">

<button class="btn btn-success btn-lg">

Submit Review

</button>

</div>

</form>

</div>

</div>

</section>

{% endblock %}
